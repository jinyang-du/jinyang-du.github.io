<div class="mt-3 d-md-none"></div>
<section id="about" class="card section-card">
    <div class="card-body">
        <h2 class="section-title">About</h2>
        <div class="text-profile-bio" {% if site.data.profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
            {{ site.data.profile.short_bio }}
        </div>
        {% if site.data.profile.cv_link %}
            <a target="_blank" href="{{ site.data.profile.cv_link | relative_url }}"><i class="fas fa-file-alt" aria-hidden="true"></i> Curriculum Vitae</a>
        {% endif %}
    </div>
</section>
