{% assign news_by_year = site.news | sort: "date" | reverse | slice: 0, include.limit | group_by_exp: "item", "item.date | date: '%Y'" -%}

<section id="news" class="card section-card mt-3">
    <div class="card-body">
        <h2 class="section-title">News</h2>
        <ul class="news-list">
            {% for year in news_by_year %}
            {% for item in year.items %}
            <li>
                <time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: "%b %Y" }}</time>
                <span>{{ item.title }}</span>
            </li>
            {% endfor %}
            {% endfor %}
        </ul>
    </div>
</section>
