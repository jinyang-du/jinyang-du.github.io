{% assign news_items = site.news | sort: "date" | reverse -%}
<section class="section-shell news-section">
    <div class="section-heading-row">
        <div>
            <div class="section-kicker">Updates</div>
            <h2 class="section-title">Latest news</h2>
        </div>
        <span class="section-index">01</span>
    </div>
    <div class="news-list">
        {% for item in news_items limit:include.limit %}
        <article class="news-item">
            <time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: "%b %Y" }}</time>
            <div class="news-item-marker" aria-hidden="true"></div>
            <div class="news-item-text">{{ item.title }}</div>
        </article>
        {% endfor %}
    </div>
</section>
