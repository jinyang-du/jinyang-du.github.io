{% assign publications = include.publications %}
<section class="section-shell publication-section">
    <div class="section-heading-row">
        <div>
            <div class="section-kicker">Research output</div>
            <h2 class="section-title">Selected publications</h2>
        </div>
        <a class="section-more" href="{{ 'publications' | relative_url }}">View all <i class="fas fa-arrow-right ml-1" aria-hidden="true"></i></a>
    </div>
    {% for item in publications limit:include.limit %}
        {% include widgets/publication_item.html item=item first=false last=false %}
    {% endfor %}
</section>
